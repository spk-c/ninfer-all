name: RTX 4090 CUDA 13.4 Windows binary release
on:
  push:
    branches: [master]
    paths: ['.github/workflows/rtx4090-binary-v0.1.0.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    if: github.repository == 'spk-c/ninfer-all-rtx4090'
    runs-on: windows-2022
    timeout-minutes: 330
    defaults:
      run:
        shell: pwsh
    env:
      NINFER_VERSION: rtx4090-v0.1.0
      SOURCE_SHA: 4ddc76ae318b88ef6cfe99dcb9f3750ecd8b7f42
    steps:
      - uses: actions/checkout@v7
        with:
          ref: rtx4090-v0.1.0
      - name: Verify release source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if((git rev-parse HEAD).Trim() -ne $env:SOURCE_SHA){throw 'Source tag moved'}
          $r=gh release view $env:NINFER_VERSION --repo $env:GITHUB_REPOSITORY --json isDraft,assets | ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or $r.isDraft -or $r.assets.Count){throw 'Release missing, draft or already has assets'}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Parse release packaging and run CPU contract checks
        run: |
          $err=$null
          [void][Management.Automation.Language.Parser]::ParseFile("$pwd/scripts/package-release.ps1",[ref]$null,[ref]$err)
          if($err.Count){throw ($err | Out-String)}
          python -m unittest discover -s tests/release -p test_windows_kernel_dll.py -v
          if($LASTEXITCODE -ne 0){throw 'Windows package tests failed'}
      - name: Install CUDA toolkit 13.4.3
        timeout-minutes: 70
        run: |
          $v='13.4.3'
          $installer=Join-Path $env:RUNNER_TEMP 'cuda.exe'
          Invoke-WebRequest "https://developer.download.nvidia.com/compute/cuda/$v/network_installers/cuda_$($v)_windows_x86_64_network.exe" -OutFile $installer
          $packages=@('nvcc','crt','nvvm','cudart','cublas','cublas_dev','nvtx','thrust','cuda_profiler_api','cuobjdump','nvprune') | ForEach-Object {$_+'_13.4'}
          $proc=Start-Process $installer -ArgumentList (@('-s')+$packages) -Wait -PassThru
          if($proc.ExitCode -ne 0){throw "CUDA installer exit code $($proc.ExitCode)"}
          $cuda=Join-Path $env:ProgramFiles 'NVIDIA GPU Computing Toolkit\CUDA\v13.4'
          foreach($f in @('bin\nvcc.exe','bin\cuobjdump.exe','lib\x64\cublas.lib')){
            if(-not (Test-Path (Join-Path $cuda $f))){throw "CUDA missing $f"}
          }
          python .github/scripts/fetch-cuda-license.py --version $v --output (Join-Path $cuda 'EULA.txt')
          if($LASTEXITCODE -ne 0){throw 'CUDA redistribution license fetch failed'}
          "CUDA_PATH=$cuda" >> $env:GITHUB_ENV
          (Join-Path $cuda 'bin') >> $env:GITHUB_PATH
      - name: Import MSVC 2022 toolchain
        run: |
          $vswhere=Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs=& $vswhere -latest -products * -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if(-not $vs){throw 'MSVC 2022 compiler missing'}
          $before=@{}
          Get-ChildItem Env: | ForEach-Object {$before[$_.Name]=$_.Value}
          $bat=Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          $vars=cmd /c ('"'+$bat+'" >nul && set')
          if($LASTEXITCODE -ne 0){throw 'vcvars64 failed'}
          foreach($line in $vars){
            if($line -match '^([^=]+)=(.*)$' -and $Matches[1] -notin @('CUDA_PATH','VCPKG_ROOT') -and $before[$Matches[1]] -cne $Matches[2]){
              "$($Matches[1])=$($Matches[2])" >> $env:GITHUB_ENV
            }
          }
      - uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          ref: 4bca8fd8654e5ba76f92661db7bfe954768ad8ef
          path: .vcpkg
      - name: Compile native CUDA 13.4 SM89 binaries
        timeout-minutes: 225
        run: |
          & .\.vcpkg\bootstrap-vcpkg.bat -disableMetrics
          if($LASTEXITCODE -ne 0){throw 'vcpkg bootstrap failed'}
          $tc=Join-Path $pwd '.vcpkg/scripts/buildsystems/vcpkg.cmake'
          $cfg=@('-S','.','-B','build-release','-G','Ninja','-DCMAKE_BUILD_TYPE=Release',
            "-DCMAKE_TOOLCHAIN_FILE=$tc",'-DVCPKG_TARGET_TRIPLET=x64-windows','-DVCPKG_HOST_TRIPLET=x64-windows',
            "-DCMAKE_CUDA_COMPILER=$env:CUDA_PATH/bin/nvcc.exe",'-DCMAKE_C_COMPILER=cl','-DCMAKE_CXX_COMPILER=cl',
            '-DCMAKE_CUDA_ARCHITECTURES=89','-DNINFER_NVCC_SPLIT_COMPILE=2',
            '-DNINFER_CUDA_PRUNE_PTX=ON','-DNINFER_WINDOWS_KERNEL_DLL=ON','-DNINFER_SHARED_RUNTIME=ON',
            '-DNINFER_BUILD_BENCHMARKS=ON','-DBUILD_TESTING=OFF')
          & cmake @cfg
          if($LASTEXITCODE -ne 0){throw 'CMake configure failed'}
          cmake --build build-release -j 2 --target ninfer ninfer-serve ninfer_bench ninfer-calibrate ninfer-perplexity ninfer-ngram-profile
          if($LASTEXITCODE -ne 0){throw 'CUDA SM89 build failed'}
      - name: Package, verify and hash portable binaries
        timeout-minutes: 50
        run: |
          $env:NINFER_BUILD_ROOT=Join-Path $pwd 'build-release'
          & .\scripts\package-release.ps1
          if($LASTEXITCODE -ne 0){throw 'Windows package verification failed'}
          $folder='ninfer-windows-x64-cuda13.4-sm89-'+$env:SOURCE_SHA.Substring(0,12)
          $info=Get-Content (Join-Path $pwd "dist/$folder/BUILD-INFO.json") -Raw | ConvertFrom-Json
          if($info.source_revision -ne $env:SOURCE_SHA -or $info.version -ne $env:NINFER_VERSION -or $info.cuda -ne '13.4' -or @($info.architectures).Count -ne 1 -or $info.architectures[0] -ne '89'){
            throw 'Release binary metadata does not match pinned tag and native SM89'
          }
      - name: Attach packages and publish stable release
        timeout-minutes: 40
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name='ninfer-windows-x64-cuda13.4-sm89-'+$env:SOURCE_SHA.Substring(0,12)
          $parts=@(Get-ChildItem dist -File | Where-Object {$_.Name -match ('^'+[regex]::Escape($name)+'[.]7z[.][0-9]{3}$')} | Sort-Object Name)
          $manifest=Join-Path $pwd ('dist/SHA256SUMS-'+$name+'.txt')
          if(-not $parts.Count -or -not (Test-Path $manifest)){throw 'Missing archives or manifest'}
          $files=@($parts | ForEach-Object FullName)+@($manifest)
          & gh release upload $env:NINFER_VERSION @files --repo $env:GITHUB_REPOSITORY
          if($LASTEXITCODE -ne 0){throw 'Release binary upload failed'}
          $remote=@(& gh release view $env:NINFER_VERSION --repo $env:GITHUB_REPOSITORY --json assets --jq '.assets[].name')
          foreach($p in $parts){if($p.Name -notin $remote){throw "Missing archive $($p.Name) on GitHub"}}
          if((Split-Path $manifest -Leaf) -notin $remote){throw 'Checksum manifest missing on GitHub'}
          $notes=(& gh release view $env:NINFER_VERSION --repo $env:GITHUB_REPOSITORY --json body --jq '.body') -join [Environment]::NewLine
          $notes=$notes.Replace('**Source-only prerelease**','**Windows binary release**')
          $notes=$notes.Replace('**No prebuilt Windows executable, installers, model weights, or binary benchmark assets** are included in this release.','Portable Windows EXE/DLL assets are attached, with checksums. Model weights are not included.')
          $notes += [Environment]::NewLine + [Environment]::NewLine + '### Windows package qualification' + [Environment]::NewLine + 'Compiled on Windows Server 2022 with CUDA 13.4 and native SM89. CUDA image, launcher startup without CUDA tools on PATH, and archive checks passed. GPU inference has NOT been tested on this GitHub-hosted runner (no RTX 4090).'
          [IO.File]::WriteAllText((Join-Path $pwd 'release-notes.md'),$notes,[Text.UTF8Encoding]::new($false))
          gh release edit $env:NINFER_VERSION --repo $env:GITHUB_REPOSITORY --prerelease=false --latest --title 'NInfer-all RTX 4090 v0.1.0 - CUDA 13.4 / SM89 (Windows)' --notes-file release-notes.md
          if($LASTEXITCODE -ne 0){throw 'Release promotion failed'}
          gh release view $env:NINFER_VERSION --repo $env:GITHUB_REPOSITORY --json name,url,isPrerelease,assets
