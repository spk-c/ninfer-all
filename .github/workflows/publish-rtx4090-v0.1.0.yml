# One-shot, idempotent publication of the first RTX 4090-focused source preview.
# Does not build or attach Windows executables. See docs/rtx4090.md.
name: Publish RTX 4090 v0.1.0 source preview

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/publish-rtx4090-v0.1.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-source-release:
    if: github.repository == 'spk-c/ninfer-all-rtx4090'
    runs-on: ubuntu-24.04
    steps:
      - name: Publish source-only prerelease if not already present
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: rtx4090-v0.1.0
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving it unchanged."
            exit 0
          fi
          cat > release-notes.md <<'RELEASE_NOTES'
          # NInfer-all — RTX 4090 / Ada SM89 source preview

          This is the first **RTX 4090-focused source preview** of [SPK-C's NInfer-all fork](https://github.com/spk-c/ninfer-all-rtx4090), based on [iamwavecut/ninfer-all](https://github.com/iamwavecut/ninfer-all). It provides dedicated build, benchmarking and qualification tooling for the **GeForce RTX 4090 (24 GB, SM89)** on Windows with **CUDA 13.4**. The upstream engine and acknowledgements are retained.

          ## Highlights

          - Native `sm_89` Windows CUDA build wrapper: `scripts/build-rtx4090.ps1`.
          - Per-device route calibration using `ninfer-calibrate`.
          - Repeatable inference benchmark tooling: `scripts/benchmark-rtx4090.ps1` and `tools/bench/tune_rtx4090.py`.
          - CUDA profiling and numerical-regression investigations of GGUF IQ3_S, IQ4_XS, SiLU/SFU, DFlash2 and MTP configurations.
          - Preserved production math defaults; unqualified SFU, BF16x8 SiLU and IQ3_S T6-loop experiments remain **opt-in/off by default**.
          - Detailed [RTX 4090 development guide](https://github.com/spk-c/ninfer-all-rtx4090/blob/master/docs/rtx4090.md) and [Huihui IQ3_S/DFlash2 qualification](https://github.com/spk-c/ninfer-all-rtx4090/blob/master/docs/performance/rtx4090-huihui-iq3s-dflash2.md).

          ## Real-world serving measurements (not a fork-vs-upstream comparison)

          On an RTX 4090 with CUDA 13.4 and **DFlash2, 5 draft tokens**, the [published Huihui Qwen3.8-27B NInfer model](https://huggingface.co/SPK1337/Huihui-Qwen3.8-27B-Uncensored-GSQ-RCO-IQ3S-Vision-DFlash2-MTP-NInfer) produced:

          | Measure | Recorded value |
          | --- | ---: |
          | Successfully completed requests | **1,831** |
          | Median per-request decode throughput | **146.6 tokens/s** |
          | P90 per-request decode throughput | **215.5 tokens/s** |
          | Median long-prefill throughput (316 requests) | **2,345 tokens/s** |

          See the [full measurement and limitations](https://huggingface.co/SPK1337/Huihui-Qwen3.8-27B-Uncensored-GSQ-RCO-IQ3S-Vision-DFlash2-MTP-NInfer/blob/main/BENCHMARK-RTX4090.md). These observations do **not** establish a speedup caused by this fork; there is no matched stock-NInfer control in this serving log. The documented experimental kernel candidates did **not** deliver a stable whole-Engine gain of at least 3% without regressions.

          ## Build (PowerShell on Windows)

          Requires Visual Studio 2022 C++ Build Tools, CMake, Ninja, CUDA 13.4, a compatible NVIDIA driver and the project's build dependencies.

          ```powershell
          git clone https://github.com/spk-c/ninfer-all-rtx4090.git
          cd ninfer-all-rtx4090
          .\scripts\build-rtx4090.ps1 -Test
          .\build-rtx4090\apps\ninfer-calibrate.exe --device 0 --detail
          ```

          To benchmark a compatible local `.ninfer` artifact:

          ```powershell
          .\scripts\benchmark-rtx4090.ps1 -Model 'C:\path\to\model.ninfer' -Preset smoke
          ```

          Consult [docs/rtx4090.md](https://github.com/spk-c/ninfer-all-rtx4090/blob/master/docs/rtx4090.md) for setup details, profiling prerequisites, repeatable A/B testing and limitations.

          ## Release status and compatibility

          - **Source-only prerelease**. GitHub auto-generates source `.zip` and `.tar.gz` archives.
          - **No prebuilt Windows executable, installers, model weights, or binary benchmark assets** are included in this release.
          - Target workflow: **Windows / RTX 4090 / native SM89 / CUDA 13.4**. Other GPUs may still be supported through upstream targets but are not the focus of this preview.
          - This is not a verified speedup over upstream or a stability/production guarantee. Test on your specific model and deployment before relying on it.

          ## Attribution

          Based on [NInfer-all by iamwavecut](https://github.com/iamwavecut/ninfer-all), originally from [NInfer by Neroued](https://github.com/Neroued/ninfer). Retains upstream credits and [Apache-2.0 license](https://github.com/spk-c/ninfer-all-rtx4090/blob/master/LICENSE).
          RELEASE_NOTES
          gh release create "$RELEASE_TAG" \
            --repo "$GH_REPO" \
            --target "$TARGET_SHA" \
            --title "NInfer-all RTX 4090 v0.1.0 — CUDA 13.4 / SM89 (source preview)" \
            --notes-file release-notes.md \
            --prerelease
          gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json url,name,tagName,isPrerelease
